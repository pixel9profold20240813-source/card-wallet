<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>卡夾 — 我的卡片</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1f342c">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-512.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="卡夾">
<style>
  :root{
    --felt: #1f342c;
    --felt-deep: #16261f;
    --paper: #eee5d3;
    --paper-dim: #e2d8c2;
    --ink: #2a2119;
    --ink-soft: #6b5e4d;
    --rail: #b8a888;
    --accent-red: #c1443c;
    --accent-gold: #d1963a;
    --accent-teal: #3e7c72;
    --accent-blue: #3e6b8a;
    --accent-plum: #7a4c6d;
    --accent-moss: #6d7a4c;
    --white: #fbf9f4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, #294438 0%, var(--felt) 45%, var(--felt-deep) 100%);
    min-height:100vh;
    font-family:'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    color: var(--paper);
    display:flex;
    justify-content:center;
    padding: env(safe-area-inset-top) 0 calc(40px + env(safe-area-inset-bottom));
  }
  #app{
    width:100%;
    max-width: 480px;
    min-height:100vh;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events:none;
    z-index:0;
  }
  header{ padding: 28px 22px 14px; position:relative; z-index:2; }
  .eyebrow{
    font-family: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
    font-size:11px; letter-spacing: 3px; color: var(--rail);
    text-transform:uppercase; margin:0 0 6px;
  }
  h1{
    font-family: 'Roboto Slab', Georgia, 'Noto Serif TC', serif;
    font-weight:700; font-size: 30px; margin:0;
    color: var(--paper); letter-spacing: 0.5px;
  }
  .sub{ font-size:13px; color: rgba(238,229,211,0.55); margin: 6px 0 0; }
  .search-row{ display:flex; gap:10px; padding: 14px 22px 6px; position:relative; z-index:2; }
  .search-box{
    flex:1; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(238,229,211,0.18); border-radius: 10px;
    padding: 11px 14px; display:flex; align-items:center; gap:8px;
  }
  .search-box input{
    background:none; border:none; outline:none; color: var(--paper);
    font-size:14px; width:100%;
  }
  .search-box input::placeholder{ color: rgba(238,229,211,0.4); }
  .search-box svg{ flex-shrink:0; opacity:0.6; }
  .stage-wrap{ position:relative; padding: 26px 22px 8px; z-index:2; }
  .stage{ position:relative; height: 300px; }
  .empty-state{ text-align:center; padding: 60px 20px; color: rgba(238,229,211,0.5); }
  .empty-state .stamp{
    font-family: 'Roboto Slab', Georgia, serif;
    font-size:17px; color: rgba(238,229,211,0.75); margin-bottom:6px;
  }
  .card{
    position:absolute; left:50%; top:6px; width: 92%; max-width: 340px;
    border-radius: 14px; background: var(--paper); color: var(--ink);
    box-shadow: 0 14px 30px rgba(0,0,0,0.35);
    transition: transform .5s cubic-bezier(.34,1.42,.32,1), box-shadow .3s, opacity .4s ease;
    cursor:pointer; overflow:hidden;
  }
  .card .tab{ position:absolute; top:0; left:0; width: 10px; height:100%; }
  .card-body{ padding: 16px 18px 16px 26px; }
  .card-behind{ height: 230px; transform-origin: top center; }
  .card-behind .card-body{ padding-top:14px; }
  .card-behind .peek-label{
    font-family: 'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:1px; color: var(--ink-soft); opacity:0.75;
  }
  .card-front{ z-index: 50; }
  .card-name{
    font-family: 'Roboto Slab', Georgia, serif;
    font-weight:700; font-size: 19px; margin: 0 0 3px; padding-right: 60px;
    word-break: break-word;
  }
  .card-cat{
    font-family: 'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
    color: var(--ink-soft); margin:0 0 14px;
  }
  .code-stage{
    background: var(--white); border-radius: 10px; padding: 14px 10px 10px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    border: 1px solid rgba(0,0,0,0.06); min-height: 96px; justify-content:center;
    position: relative; cursor: zoom-in;
  }
  .zoom-hint{
    position:absolute; bottom:8px; right:10px;
    display:flex; align-items:center; gap:3px;
    font-family: 'IBM Plex Mono', monospace; font-size:9.5px;
    letter-spacing:0.5px; color: rgba(42,33,25,0.35);
    pointer-events:none;
  }
  .code-stage svg{ width:100%; height:auto; max-height:78px; }
  .qr-box{ padding: 4px; line-height:0; }
  .qr-box img, .qr-box table{ image-rendering: pixelated; }
  .code-text{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px; letter-spacing: 1.2px; color: var(--ink);
    word-break: break-all; text-align:center;
  }
  .code-fallback{ font-size:12px; color: var(--accent-red); text-align:center; padding: 6px 4px; }
  .card-note{
    font-size:12px; color: var(--ink-soft); margin-top:10px; padding-top:10px;
    border-top: 1px dashed rgba(42,33,25,0.18);
  }
  .card-actions{ position:absolute; top:14px; right:14px; display:flex; gap:6px; z-index: 5; }
  .icon-btn{
    width:30px; height:30px; border-radius:8px; border:none;
    background: rgba(42,33,25,0.07); display:flex; align-items:center; justify-content:center;
    cursor:pointer; color: var(--ink-soft);
  }
  .icon-btn:active{ background: rgba(42,33,25,0.14); }
  .icon-btn.danger:active{ background: rgba(193,68,60,0.18); color:var(--accent-red); }
  .rail-label{
    padding: 6px 22px 8px; font-family: 'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:2px; color: rgba(238,229,211,0.4); text-transform:uppercase;
  }
  .rail{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
    gap:10px; padding: 4px 22px 18px;
  }
  .rail-item{
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(238,229,211,0.15); border-left: 4px solid var(--accent-teal);
    border-radius: 8px; padding: 9px 13px; cursor:pointer; min-width:0;
  }
  .rail-item.active{ background: rgba(238,229,211,0.14); border-color: rgba(238,229,211,0.4); }
  .rail-item .n{
    font-family: 'Roboto Slab', Georgia, serif; font-size:13px; font-weight:700;
    color: var(--paper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .rail-item .c{
    font-family: 'IBM Plex Mono', monospace; font-size:10px;
    color: rgba(238,229,211,0.45); margin-top:3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .fab{
    position:fixed; bottom: 26px; left:50%; transform: translateX(calc(-50% + 190px));
    width:56px; height:56px; border-radius:50%; background: var(--accent-gold);
    color: var(--felt-deep); border:none; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    font-size:28px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index: 40;
  }
  @media (max-width:479px){ .fab{ right:22px; left:auto; transform:none; bottom:24px; } }
  .overlay{
    position:fixed; inset:0; background: rgba(10,14,12,0.68);
    display:flex; align-items:flex-end; justify-content:center; z-index: 100;
    opacity:0; pointer-events:none; transition: opacity .25s;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    width:100%; max-width:480px; background: var(--paper); color: var(--ink);
    border-radius: 20px 20px 0 0; padding: 22px 22px 28px;
    transform: translateY(30px); transition: transform .3s cubic-bezier(.22,.9,.3,1);
    max-height: 88vh; overflow-y:auto;
  }
  .overlay.show .sheet{ transform: translateY(0); }
  .sheet-title{ font-family: 'Roboto Slab', Georgia, serif; font-weight:700; font-size:20px; margin:0 0 18px; }
  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-family: 'IBM Plex Mono', monospace; font-size:11px;
    letter-spacing:1.5px; text-transform:uppercase; color: var(--ink-soft); margin-bottom:6px;
  }
  .field input, .field textarea{
    width:100%; border: 1px solid rgba(42,33,25,0.22); background: var(--white);
    border-radius:8px; padding: 10px 12px; font-size:14px; color: var(--ink); outline:none;
    font-family: inherit;
  }
  .field input:focus, .field textarea:focus{ border-color: var(--accent-teal); }
  .hint{ font-size:11px; color: var(--ink-soft); margin-top:5px; }
  .hint.ok{ color: var(--accent-teal); font-weight:500; }
  .hint.bad{ color: var(--accent-red); font-weight:500; }
  .scan-row{ display:flex; gap:8px; }
  .scan-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    padding: 10px 8px; border-radius:8px; border: 1px dashed rgba(42,33,25,0.28);
    background: rgba(62,124,114,0.06); color: var(--accent-teal);
    font-family: inherit; font-size:13px; font-weight:500; cursor:pointer;
  }
  .scan-btn:active{ background: rgba(62,124,114,0.14); }
  .scan-btn svg{ flex-shrink:0; }
  .scan-btn.busy{ opacity:0.55; pointer-events:none; }
  .seg{ display:flex; gap:8px; }
  .seg button{
    flex:1; padding:9px 6px; border-radius:8px; border: 1px solid rgba(42,33,25,0.22);
    background: var(--white); font-size:12.5px; color: var(--ink-soft); cursor:pointer;
    font-family: inherit;
  }
  .seg button.active{ background: var(--felt); border-color: var(--felt); color: var(--paper); }
  .swatches{ display:flex; gap:9px; flex-wrap:wrap; }
  .swatch{ width:30px; height:30px; border-radius:50%; border: 2px solid transparent; cursor:pointer; }
  .swatch.active{ border-color: var(--ink); }
  .sheet-btns{ display:flex; gap:10px; margin-top: 6px; }
  .btn{
    flex:1; padding: 13px; border-radius:10px; border:none;
    font-weight:500; font-size:14px; cursor:pointer; font-family: inherit;
  }
  .btn.primary{ background: var(--felt); color: var(--paper); }
  .btn.ghost{ background: rgba(42,33,25,0.08); color: var(--ink-soft); }
  .btn.delete-confirm{ background: var(--accent-red); color: var(--white); }
  .err{ color: var(--accent-red); font-size:12px; margin: -10px 0 14px; display:none; }
  .toast{
    position:fixed; bottom:100px; left:50%; transform: translateX(-50%) translateY(10px);
    background: var(--paper); color: var(--ink); padding: 10px 18px; border-radius: 30px;
    font-size:13px; font-weight:500; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    opacity:0; pointer-events:none; transition: all .25s; z-index: 200;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  .slot-badge{
    position:absolute; top:14px; left:24px;
    background: var(--felt); color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 1px;
    padding: 3px 7px; border-radius: 5px;
    z-index: 6;
  }

  /* Fullscreen quick view — opened from an installed App Shortcut */
  .quick-view{
    display:none;
    position:fixed; inset:0; z-index: 300;
    background: var(--white);
    flex-direction:column; align-items:center; justify-content:center;
    padding: env(safe-area-inset-top) 24px calc(24px + env(safe-area-inset-bottom));
  }
  .quick-view.show{ display:flex; }
  .quick-close{
    position:absolute; top: calc(18px + env(safe-area-inset-top)); right:18px;
    width:38px; height:38px; border-radius:50%; border:none;
    background: rgba(42,33,25,0.08); color: var(--ink-soft);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .quick-body{ width:100%; max-width:360px; text-align:center; }
  .quick-body .qname{
    font-family: 'Roboto Slab', Georgia, serif; font-weight:700;
    font-size: 22px; color: var(--ink); margin: 0 0 4px;
  }
  .quick-body .qmeta{
    font-family: 'IBM Plex Mono', monospace; font-size:11px;
    letter-spacing:1.5px; text-transform:uppercase; color: var(--ink-soft); margin: 0 0 22px;
  }
  .quick-code{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .quick-code svg{ width:100%; max-width:320px; height:auto; }
  .quick-code .code-text{ font-size:15px; letter-spacing:2px; }
  .quick-empty{ color: var(--ink-soft); font-size:14px; line-height:1.7; }

  /* Live camera scan — dark scanner-style overlay, video feed with a guide frame */
  .live-scan{
    display:none;
    position:fixed; inset:0; z-index: 310;
    background: #0b0f0d;
  }
  .live-scan.show{ display:block; }
  .live-scan-topbar{
    position:absolute; top:0; left:0; right:0;
    z-index:2;
    padding: calc(16px + env(safe-area-inset-top)) 18px 16px;
    display:flex; align-items:center; justify-content:space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  }
  .live-scan-topbar span{
    color: var(--paper); font-size:13px; font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.5px;
  }
  .live-scan-topbar .quick-close{ background: rgba(255,255,255,0.15); color: var(--paper); }
  #liveScanVideo{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover;
  }
  .live-scan-frame{
    position:absolute; top:50%; left:50%; transform: translate(-50%,-50%);
    width:78%; max-width:340px; aspect-ratio: 16/10;
    border: 3px solid rgba(238,229,211,0.85);
    border-radius: 16px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.38);
    pointer-events:none;
  }
  .live-scan-hint{
    position:absolute; left:0; right:0; bottom: calc(36px + env(safe-area-inset-bottom));
    text-align:center; color: rgba(238,229,211,0.85);
    font-size:13px; pointer-events:none;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <p class="eyebrow">CARD FILE · 資料卡夾</p>
    <h1>我的卡片</h1>
    <p class="sub" id="countSub">尚未新增任何卡片</p>
  </header>

  <div class="search-row">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" placeholder="搜尋卡片名稱或卡號…">
    </div>
  </div>

  <div class="stage-wrap"><div class="stage" id="stage"></div></div>

  <div id="railSection">
    <p class="rail-label">全部卡片</p>
    <div class="rail" id="rail"></div>
  </div>

  <button class="fab" id="addBtn" aria-label="新增卡片">＋</button>
</div>

<div class="overlay" id="formOverlay">
  <div class="sheet">
    <h2 class="sheet-title" id="formTitle">新增卡片</h2>
    <div class="field">
      <label>卡片名稱</label>
      <input id="fName" placeholder="例如：全聯會員卡、統一發票載具">
    </div>
    <p class="err" id="nameErr">請輸入卡片名稱</p>

    <div class="field">
      <label>卡號 / 條碼內容</label>
      <input id="fCode" placeholder="輸入數字或條碼字串，或用下方掃描">
      <p class="hint" id="autoHint">格式將自動偵測</p>
    </div>
    <p class="err" id="codeErr">請輸入卡號內容</p>

    <div class="field">
      <div class="scan-row">
        <button type="button" class="scan-btn" id="scanLiveBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>
          即時掃描
        </button>
        <button type="button" class="scan-btn" id="scanUploadBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          上傳截圖
        </button>
      </div>
      <input type="file" accept="image/*" id="scanUploadInput" style="display:none;">
      <p class="hint" id="scanStatus"></p>
      <canvas id="scanCanvas" style="display:none;"></canvas>
    </div>

    <div class="field">
      <label>顯示格式</label>
      <div class="seg">
        <button type="button" data-fmt="auto" id="fmtAuto">自動偵測</button>
        <button type="button" data-fmt="barcode" id="fmtBarcode">條碼</button>
        <button type="button" data-fmt="qr" id="fmtQr">QR Code</button>
      </div>
    </div>

    <div class="field">
      <label>標籤色</label>
      <div class="swatches" id="swatches"></div>
    </div>

    <div class="field">
      <label>主畫面快捷（長按 App 圖示）</label>
      <div class="seg">
        <button type="button" data-slot="0" id="slot0">不指定</button>
        <button type="button" data-slot="1" id="slot1">快捷 1</button>
        <button type="button" data-slot="2" id="slot2">快捷 2</button>
        <button type="button" data-slot="3" id="slot3">快捷 3</button>
      </div>
      <p class="hint" id="slotHint">指定後，長按主畫面 App 圖示即可直接跳到此卡的全螢幕條碼</p>
    </div>

    <div class="field">
      <label>備註（選填）</label>
      <textarea id="fNote" rows="2" placeholder="例如：結帳時先出示載具再付款"></textarea>
    </div>

    <div class="sheet-btns">
      <button class="btn ghost" id="cancelBtn">取消</button>
      <button class="btn primary" id="saveBtn">儲存</button>
    </div>
  </div>
</div>

<div class="overlay" id="delOverlay">
  <div class="sheet">
    <h2 class="sheet-title">刪除這張卡片？</h2>
    <p style="font-size:13px;color:var(--ink-soft);margin:-8px 0 18px;">此動作無法復原。</p>
    <div class="sheet-btns">
      <button class="btn ghost" id="delCancel">取消</button>
      <button class="btn delete-confirm" id="delConfirm">刪除</button>
    </div>
  </div>
</div>

<!-- Fullscreen quick-view (opened via App shortcut / ?slot=N) -->
<div id="quickView" class="quick-view">
  <button class="quick-close" id="quickClose" aria-label="關閉">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <div class="quick-body" id="quickBody"></div>
</div>

<!-- Live camera scan -->
<div id="liveScanOverlay" class="live-scan">
  <div class="live-scan-topbar">
    <span id="liveScanStatus">正在啟動相機…</span>
    <button class="quick-close" id="liveScanClose" aria-label="關閉">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <video id="liveScanVideo" playsinline muted autoplay></video>
  <div class="live-scan-frame"></div>
  <div class="live-scan-hint">將條碼／QR Code 對準框內</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const COLORS = [
    {v:'#c1443c', name:'紅'},
    {v:'#d1963a', name:'金'},
    {v:'#3e7c72', name:'綠'},
    {v:'#3e6b8a', name:'藍'},
    {v:'#7a4c6d', name:'紫'},
    {v:'#6d7a4c', name:'橄欖'}
  ];

  let cards = [];
  let activeId = null;
  let cardEls = new Map(); // card id -> persisted DOM node, so CSS transitions animate on reorder
  let editingId = null;
  let deletingId = null;
  let pendingFmt = 'auto';
  let pendingColor = COLORS[0].v;
  let pendingSlot = 0;

  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  const rail = $('rail');
  const countSub = $('countSub');

  function uid(){ return 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function toast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=> t.classList.remove('show'), 1600);
  }

  // CODE128 (JsBarcode) can encode any ASCII 0-127 character. If the code
  // contains non-ASCII characters (e.g. Chinese) or is long, QR reads more
  // reliably, so auto-detect steers toward QR in those cases.
  function isAsciiOnly(str){ return /^[\x20-\x7E]+$/.test(str); }
  function autoFormat(code){
    if(!code) return 'barcode';
    if(!isAsciiOnly(code)) return 'qr';
    if(code.length > 24) return 'qr';
    return 'barcode';
  }
  function resolvedFormat(card){
    return card.format === 'auto' ? autoFormat(card.code) : card.format;
  }

  async function loadCards(){
    try{
      const raw = localStorage.getItem('cardwallet:cards');
      cards = raw ? JSON.parse(raw) : [];
    }catch(e){ cards = []; }
    if(cards.length && !activeId) activeId = cards[0].id;
    render();
  }

  async function persist(){
    try{ localStorage.setItem('cardwallet:cards', JSON.stringify(cards)); }
    catch(e){ toast('儲存失敗，請重試'); }
  }

  function filteredCards(){
    const q = $('searchInput').value.trim().toLowerCase();
    if(!q) return cards;
    return cards.filter(c => c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q));
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function renderRail(){
    const list = filteredCards();
    rail.innerHTML = '';
    list.forEach(c => {
      const el = document.createElement('div');
      el.className = 'rail-item' + (c.id === activeId ? ' active' : '');
      el.style.borderLeftColor = c.color;
      el.innerHTML = `<div class="n">${escapeHtml(c.name)}</div><div class="c">${escapeHtml(c.code)}</div>`;
      el.addEventListener('click', () => { activeId = c.id; render(); });
      rail.appendChild(el);
    });
  }

  function formatLabel(fmt){
    return fmt === 'qr' ? 'QR CODE' : 'BARCODE';
  }

  function renderStage(){
    const list = filteredCards();
    if(list.length === 0){
      cardEls.forEach(el => el.remove());
      cardEls.clear();
      stage.style.height = 'auto';
      stage.innerHTML = `<div class="empty-state">
          <p class="stamp">— 抽屜是空的 —</p>
          <p>點右下角「＋」新增第一張卡片</p>
        </div>`;
      return;
    }
    const emptyEl = stage.querySelector('.empty-state');
    if(emptyEl) emptyEl.remove();
    stage.style.height = '300px';

    let active = list.find(c => c.id === activeId) || list[0];
    activeId = active.id;
    const others = list.filter(c => c.id !== active.id).slice(0, 3);
    const visibleIds = new Set([active.id, ...others.map(c => c.id)]);

    // drop nodes for cards no longer shown (deleted, filtered out, or pushed past depth 3)
    cardEls.forEach((el, id) => {
      if(!visibleIds.has(id)){ el.remove(); cardEls.delete(id); }
    });

    // fanned stack, back-to-front so later (closer) cards sit on top visually.
    // Spread is deliberately generous so the "slide to front" motion reads clearly.
    const fanAngles = [10, -11, 9];
    for(let i = others.length - 1; i >= 0; i--){
      const c = others[i];
      const depth = i + 1;
      let el = cardEls.get(c.id);
      let isNewEl = false;
      if(!el){
        el = document.createElement('div');
        stage.appendChild(el);
        cardEls.set(c.id, el);
        isNewEl = true;
      }
      el.className = 'card card-behind';
      el.style.zIndex = 10 + (others.length - i);
      const angle = fanAngles[i % fanAngles.length];
      el.style.transform = `translateX(-50%) translateY(${depth*20}px) scale(${1 - depth*0.075}) rotate(${angle}deg)`;
      el.style.opacity = 0.85 - depth*0.2;
      el.innerHTML = `<div class="tab" style="background:${c.color}"></div>
        <div class="card-body">
          <p class="card-name" style="font-size:16px;">${escapeHtml(c.name)}</p>
          <p class="peek-label">輕點以切換到最上面</p>
        </div>`;
      el.onclick = () => { activeId = c.id; render(); };
      fadeInBody(el, isNewEl);
    }

    const fmt = resolvedFormat(active);
    let front = cardEls.get(active.id);
    let isNewFront = false;
    if(!front){
      front = document.createElement('div');
      cardEls.set(active.id, front);
      isNewFront = true;
    }
    front.className = 'card card-front';
    front.style.zIndex = 50;
    front.style.opacity = 1;
    front.style.transform = 'translateX(-50%) translateY(0) scale(1) rotate(0deg)';
    front.onclick = null;
    front.innerHTML = `
      <div class="tab" style="background:${active.color}"></div>
      ${active.slot ? `<div class="slot-badge">快捷 ${active.slot}</div>` : ''}
      <div class="card-actions">
        <button class="icon-btn" data-act="edit" title="編輯">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="icon-btn danger" data-act="del" title="刪除">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
      </div>
      <div class="card-body">
        <p class="card-name">${escapeHtml(active.name)}</p>
        <p class="card-cat">${formatLabel(fmt)}${active.format === 'auto' ? ' · 自動' : ''} · ${COLORS.find(x=>x.v===active.color) ? COLORS.find(x=>x.v===active.color).name + '色標' : ''}</p>
        <div class="code-stage" id="codeStage"></div>
        ${active.note ? `<p class="card-note">${escapeHtml(active.note)}</p>` : ''}
      </div>
    `;
    // re-append last so it's on top of DOM order too (stacking-context safety)
    stage.appendChild(front);

    const codeStage = front.querySelector('#codeStage');
    renderCode(codeStage, active.code, fmt);
    const hint = document.createElement('div');
    hint.className = 'zoom-hint';
    hint.innerHTML = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> 放大`;
    codeStage.appendChild(hint);
    codeStage.addEventListener('click', (e) => { e.stopPropagation(); openZoom(active); });

    front.querySelector('[data-act="edit"]').addEventListener('click', (e)=>{ e.stopPropagation(); openForm(active.id); });
    front.querySelector('[data-act="del"]').addEventListener('click', (e)=>{ e.stopPropagation(); openDelete(active.id); });
    fadeInBody(front, isNewFront);
  }

  // Content inside a reused card node swaps instantly (different card's text/buttons),
  // which reads as a "jump" even while the outer position animates smoothly. Fading the
  // body in softens that swap so the whole transition feels continuous.
  function fadeInBody(el, skipFade){
    const body = el.querySelector('.card-body');
    if(!body) return;
    if(skipFade){ body.style.transition = 'none'; body.style.opacity = '1'; return; }
    body.style.transition = 'none';
    body.style.opacity = '0';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        body.style.transition = 'opacity .38s ease .06s';
        body.style.opacity = '1';
      });
    });
  }

  // Tap-to-zoom: reuse the same fullscreen white view used by App Shortcuts,
  // since a large, high-contrast barcode is exactly what's needed at checkout.
  function openZoom(card){
    const fmt = resolvedFormat(card);
    const body = $('quickBody');
    body.innerHTML = `
      <p class="qname">${escapeHtml(card.name)}</p>
      <p class="qmeta">${formatLabel(fmt)}${card.format === 'auto' ? ' · 自動' : ''}</p>
      <div class="quick-code" id="quickCode"></div>
    `;
    renderCode($('quickCode'), card.code, fmt);
    $('quickView').classList.add('show');
  }

  // JsBarcode + qrcode-generator (~123KB) are only needed to draw the barcode/QR
  // graphic itself — not for the app shell to appear. Loading them via a dynamically
  // inserted <script> (kicked off right after first paint, see bottom of file) lets
  // the header/search/card-list shell render first; the code graphic pops in shortly
  // after instead of blocking everything before it.
  let codegenLoadPromise = null;
  function ensureCodegenLoaded(){
    if(typeof JsBarcode !== 'undefined' && typeof qrcode !== 'undefined') return Promise.resolve();
    if(codegenLoadPromise) return codegenLoadPromise;
    codegenLoadPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = './codegen-bundle.js';
      script.onload = () => resolve();
      script.onerror = () => { codegenLoadPromise = null; reject(new Error('codegen load failed')); };
      document.head.appendChild(script);
    });
    return codegenLoadPromise;
  }

  function renderCode(container, code, fmt){
    if(typeof JsBarcode === 'undefined' || typeof qrcode === 'undefined'){
      container.innerHTML = '<p class="code-fallback" style="color:var(--ink-soft);">條碼產生中…</p>';
      ensureCodegenLoaded().then(() => {
        if(document.body.contains(container)) renderCode(container, code, fmt);
      }).catch(() => {
        container.innerHTML = '<p class="code-fallback">條碼功能載入失敗，請重新整理頁面</p>';
      });
      return;
    }
    container.innerHTML = '';
    let drew = false;

    if(fmt === 'qr'){
      try{
        const box = document.createElement('div');
        box.className = 'qr-box';
        container.appendChild(box);
        const qr = qrcode(0, 'M');
        qr.addData(code);
        qr.make();
        box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2 });
        drew = true;
      }catch(e){ drew = false; }
    } else {
      try{
        const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
        container.appendChild(svg);
        JsBarcode(svg, code, { format:'CODE128', lineColor:'#2a2119', width:2, height:64, displayValue:false, margin:0 });
        drew = true;
      }catch(e){ drew = false; }
    }

    if(!drew){
      // fallback: try the other format automatically before giving up
      const altFmt = fmt === 'qr' ? 'barcode' : 'qr';
      try{
        if(altFmt === 'qr'){
          const box = document.createElement('div');
          box.className = 'qr-box';
          container.appendChild(box);
          const qr = qrcode(0, 'M');
          qr.addData(code);
          qr.make();
          box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2 });
          drew = true;
        } else {
          const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
          container.appendChild(svg);
          JsBarcode(svg, code, { format:'CODE128', lineColor:'#2a2119', width:2, height:64, displayValue:false, margin:0 });
          drew = true;
        }
      }catch(e){ drew = false; }
    }

    if(!drew){
      const p = document.createElement('p');
      p.className = 'code-fallback';
      p.textContent = '此卡號無法產生條碼／QR，請確認內容';
      container.appendChild(p);
    }

    const codeText = document.createElement('p');
    codeText.className = 'code-text';
    codeText.textContent = code;
    container.appendChild(codeText);
  }

  function render(){
    const list = filteredCards();
    countSub.textContent = cards.length === 0
      ? '尚未新增任何卡片'
      : (list.length === cards.length ? `共 ${cards.length} 張卡片` : `符合搜尋：${list.length} / ${cards.length} 張`);
    renderStage();
    renderRail();
  }

  const formOverlay = $('formOverlay');
  function buildSwatches(){
    const wrap = $('swatches');
    wrap.innerHTML = '';
    COLORS.forEach(c => {
      const s = document.createElement('div');
      s.className = 'swatch' + (c.v === pendingColor ? ' active' : '');
      s.style.background = c.v;
      s.addEventListener('click', () => { pendingColor = c.v; buildSwatches(); });
      wrap.appendChild(s);
    });
  }
  function setFmt(fmt){
    pendingFmt = fmt;
    $('fmtAuto').classList.toggle('active', fmt==='auto');
    $('fmtBarcode').classList.toggle('active', fmt==='barcode');
    $('fmtQr').classList.toggle('active', fmt==='qr');
    updateAutoHint();
  }
  function updateAutoHint(){
    const code = $('fCode').value.trim();
    if(pendingFmt !== 'auto'){ $('autoHint').textContent = ''; return; }
    if(!code){ $('autoHint').textContent = '格式將自動偵測'; return; }
    const guess = autoFormat(code);
    $('autoHint').textContent = '自動偵測結果：' + (guess === 'qr' ? 'QR Code（內容含中文或較長）' : '條碼 Barcode');
  }
  $('fmtAuto').addEventListener('click', ()=> setFmt('auto'));
  $('fmtBarcode').addEventListener('click', ()=> setFmt('barcode'));
  $('fmtQr').addEventListener('click', ()=> setFmt('qr'));
  $('fCode').addEventListener('input', updateAutoHint);

  // ===== Scan-to-fill: decode a barcode/QR straight from a photo or screenshot =====
  // ZXing (~780KB) is the single biggest thing in this app, but most visits never touch
  // the scan feature — they just open the wallet and look at a card. Loading it eagerly
  // meant the whole app sat behind a huge parse/execute before anything was interactive.
  // Instead it's fetched only the first time a scan button is actually pressed (and then
  // cached by the service worker, so every use after that is instant, online or off).
  let zxingLoadPromise = null;
  function ensureZXingLoaded(){
    if(window.ZXingBrowser) return Promise.resolve();
    if(zxingLoadPromise) return zxingLoadPromise;
    setScanStatus('準備辨識功能中…（首次使用需下載一次）');
    zxingLoadPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = './zxing-bundle.js';
      script.onload = () => resolve();
      script.onerror = () => { zxingLoadPromise = null; reject(new Error('zxing load failed')); };
      document.head.appendChild(script);
    });
    return zxingLoadPromise;
  }

  let zxingReader = null;
  function getReader(){
    if(!zxingReader) zxingReader = new ZXingBrowser.BrowserMultiFormatReader();
    return zxingReader;
  }
  function setScanStatus(msg, kind){
    const el = $('scanStatus');
    el.textContent = msg;
    el.className = 'hint' + (kind ? ' ' + kind : '');
  }

  // Splits the image into overlapping regions, ordered center-out (people tend to
  // roughly center the subject). A screenshot's barcode already fills the frame and
  // gets caught by the whole-image passes; a phone photo often shows the whole card
  // from a distance, so the barcode itself is a small part of a huge frame — tiling
  // lets each region be decoded at effectively higher zoom.
  function computeTiles(w, h, cols, rows, overlap){
    const tw = w / (cols - (cols-1)*overlap);
    const th = h / (rows - (rows-1)*overlap);
    const tiles = [];
    for(let ry = 0; ry < rows; ry++){
      for(let rx = 0; rx < cols; rx++){
        const sx = rx * tw * (1-overlap), sy = ry * th * (1-overlap);
        const sw = Math.min(tw, w - sx), sh = Math.min(th, h - sy);
        const cx = sx + sw/2, cy = sy + sh/2;
        tiles.push({ sx, sy, sw, sh, d: Math.hypot(cx - w/2, cy - h/2) });
      }
    }
    tiles.sort((a, b) => a.d - b.d);
    return tiles;
  }

  function decodeRegion(img, region, maxDim, tryHarder){
    const canvas = $('scanCanvas');
    const sx = region ? region.sx : 0, sy = region ? region.sy : 0;
    const sw = region ? region.sw : img.width, sh = region ? region.sh : img.height;
    const scale = Math.min(1, maxDim / Math.max(sw, sh));
    canvas.width = Math.max(1, Math.round(sw * scale));
    canvas.height = Math.max(1, Math.round(sh * scale));
    canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

    const reader = getReader();
    const hints = new Map();
    if(tryHarder) hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    reader.setHints(hints);
    return reader.decodeFromCanvas(canvas); // throws if nothing found in this region
  }

  // Bilinear-interpolated CLAHE (contrast-limited adaptive histogram equalization),
  // run directly on canvas pixel data. A faded/low-ink barcode print photographed under
  // ordinary lighting often has bars only slightly darker than the card itself — nowhere
  // near black-on-white. A single global contrast adjustment can't fix that (the "dark"
  // ink and the paper are still close in value across the whole photo), but equalizing
  // within small local windows pulls apart whatever contrast exists in that neighborhood,
  // and the bilinear blend between windows avoids hard seams across tile edges.
  function claheEnhance(canvas, tilesX, tilesY, clipLimit){
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const imageData = ctx.getImageData(0, 0, w, h);
    const data = imageData.data;
    const gray = new Uint8ClampedArray(w * h);
    for(let i = 0, p = 0; i < data.length; i += 4, p++){
      gray[p] = (data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114) | 0;
    }

    const tileW = Math.ceil(w / tilesX), tileH = Math.ceil(h / tilesY);
    const luts = [];
    for(let ty = 0; ty < tilesY; ty++){
      const row = [];
      for(let tx = 0; tx < tilesX; tx++){
        const x0 = tx*tileW, y0 = ty*tileH;
        const x1 = Math.min(x0+tileW, w), y1 = Math.min(y0+tileH, h);
        const hist = new Float64Array(256);
        let n = 0;
        for(let y = y0; y < y1; y++){
          const off = y*w;
          for(let x = x0; x < x1; x++){ hist[gray[off+x]]++; n++; }
        }
        const clip = Math.max((clipLimit*n)/256, 1);
        let excess = 0;
        for(let i = 0; i < 256; i++){ if(hist[i] > clip){ excess += hist[i]-clip; hist[i] = clip; } }
        const redist = excess/256;
        for(let i = 0; i < 256; i++) hist[i] += redist;
        const lut = new Uint8ClampedArray(256);
        let cdf = 0;
        for(let i = 0; i < 256; i++){ cdf += hist[i]; lut[i] = Math.round((cdf/n)*255); }
        row.push(lut);
      }
      luts.push(row);
    }

    const out = new Uint8ClampedArray(data.length);
    for(let y = 0; y < h; y++){
      let ty = (y - tileH/2)/tileH, ty0 = Math.floor(ty), ty1 = ty0+1, fy = ty-ty0;
      ty0 = Math.max(0, Math.min(tilesY-1, ty0)); ty1 = Math.max(0, Math.min(tilesY-1, ty1));
      for(let x = 0; x < w; x++){
        let tx = (x - tileW/2)/tileW, tx0 = Math.floor(tx), tx1 = tx0+1, fx = tx-tx0;
        tx0 = Math.max(0, Math.min(tilesX-1, tx0)); tx1 = Math.max(0, Math.min(tilesX-1, tx1));
        const v = gray[y*w+x];
        const top = luts[ty0][tx0][v]*(1-fx) + luts[ty0][tx1][v]*fx;
        const bot = luts[ty1][tx0][v]*(1-fx) + luts[ty1][tx1][v]*fx;
        const val = top*(1-fy) + bot*fy;
        const p = (y*w+x)*4;
        out[p] = out[p+1] = out[p+2] = val;
        out[p+3] = 255;
      }
    }
    ctx.putImageData(new ImageData(out, w, h), 0, 0);
  }

  // Wide-but-short regions matching a 1D barcode's own proportions — unlike the square
  // tiles above, these never cut through a wide barcode's width, only its (much more
  // forgiving) height. This is what actually rescues "whole card photographed from a
  // normal distance" once the barcode print itself is also low-contrast.
  function computeWideGrid(w, h, tileWFrac, tileHFrac, stepHFrac){
    const tw = w*tileWFrac, th = h*tileHFrac;
    const xs = [0, w-tw];
    const ys = []; for(let y = 0; y <= h-th+1e-6; y += h*stepHFrac) ys.push(y);
    if(ys[ys.length-1] < h-th-1) ys.push(h-th);
    const tiles = [];
    for(const sy of ys) for(const sx of xs){
      const cx = sx+tw/2, cy = sy+th/2;
      tiles.push({ sx, sy, sw: tw, sh: th, d: Math.hypot(cx-w/2, cy-h/2) });
    }
    tiles.sort((a, b) => a.d - b.d);
    return tiles;
  }

  const yieldToUI = () => new Promise(r => setTimeout(r, 0));

  async function multiPassDecode(img){
    // Pass 1 — fast whole-image pass, no extra effort. Catches the easy cases
    // (screenshots, a barcode that already fills most of the frame) near-instantly.
    try{ return decodeRegion(img, null, 1000, false); }catch(e){}
    await yieldToUI();
    setScanStatus('辨識中…（加強比對）');

    // Pass 2 — whole image again at higher resolution with TRY_HARDER, for photos
    // that are merely blurry/rotated/low-contrast but still reasonably large in frame.
    try{ return decodeRegion(img, null, 1800, true); }catch(e){}
    await yieldToUI();
    setScanStatus('辨識中…（逐區域掃描）');

    // Pass 3 — tile the ORIGINAL resolution into overlapping regions and try each,
    // center-out. This is what rescues "whole card photographed from a distance".
    const tiles = computeTiles(img.width, img.height, 3, 3, 0.15);
    for(const t of tiles){
      try{ return decodeRegion(img, t, 1400, true); }catch(e){}
      await yieldToUI();
    }
    await yieldToUI();
    setScanStatus('辨識中…（最終加強掃描）');

    // Pass 4 — wide-short regions (matching a barcode's own proportions, so a wide
    // barcode never gets cut through) plus CLAHE local-contrast enhancement. This is
    // specifically for faded, low-ink, or low-contrast prints that passes 1–3 can't
    // separate from the background even at full resolution.
    const wideTiles = computeWideGrid(img.width, img.height, 0.68, 0.24, 0.18);
    for(const t of wideTiles){
      try{ return decodeRegion(img, t, 1400, true); }catch(e){}
      await yieldToUI();
      const canvas = $('scanCanvas'); // decodeRegion just drew this exact region into it
      try{
        claheEnhance(canvas, 8, 8, 3.0);
        const reader = getReader();
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
        reader.setHints(hints);
        return reader.decodeFromCanvas(canvas);
      }catch(e){}
      await yieldToUI();
    }
    return null;
  }

  async function decodeImageFile(file){
    const upBtn = $('scanUploadBtn');
    upBtn.classList.add('busy');
    setScanStatus('辨識中…');

    try{
      await ensureZXingLoaded();
    }catch(e){
      setScanStatus('辨識功能載入失敗，請檢查網路後重試', 'bad');
      upBtn.classList.remove('busy');
      return;
    }

    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = async () => {
      try{
        setScanStatus('辨識中…');
        const result = await multiPassDecode(img);
        if(!result){
          setScanStatus('無法辨識條碼，請靠近拍攝、避免反光模糊，或手動輸入', 'bad');
          return;
        }
        const text = result.getText();
        const isQr = result.getBarcodeFormat() === ZXing.BarcodeFormat.QR_CODE;

        $('fCode').value = text;
        pendingFmt = isQr ? 'qr' : 'barcode';
        setFmt(pendingFmt);
        setScanStatus('已辨識：' + text, 'ok');
        toast('已自動填入卡號');
      }catch(e){
        setScanStatus('無法辨識條碼，請靠近拍攝、避免反光模糊，或手動輸入', 'bad');
      }finally{
        upBtn.classList.remove('busy');
        URL.revokeObjectURL(url);
      }
    };
    img.onerror = () => {
      setScanStatus('圖片讀取失敗，請重試', 'bad');
      upBtn.classList.remove('busy');
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }
  $('scanUploadBtn').addEventListener('click', () => $('scanUploadInput').click());
  $('scanUploadInput').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if(file) decodeImageFile(file);
    e.target.value = ''; // allow re-selecting the same file next time
  });

  // ===== Live camera scan =====
  // Keeps the video stream running and feeds every frame to ZXing until a code is
  // found — no photo round-trip, so a clear code in hand usually resolves almost
  // instantly. Upload stays as the fallback for screenshots and hard-to-read prints,
  // where the multi-pass + CLAHE pipeline above does better than a live frame can.
  let liveScanControls = null;

  function stopLiveScan(){
    if(liveScanControls){
      try{ liveScanControls.stop(); }catch(e){}
      liveScanControls = null;
    }
    const video = $('liveScanVideo');
    if(video.srcObject){
      video.srcObject.getTracks().forEach(t => t.stop());
      video.srcObject = null;
    }
  }

  function closeLiveScan(){
    stopLiveScan();
    $('liveScanOverlay').classList.remove('show');
  }

  async function openLiveScan(){
    $('liveScanOverlay').classList.add('show');
    $('liveScanStatus').textContent = '正在啟動相機…';

    try{
      await ensureZXingLoaded();
    }catch(e){
      $('liveScanStatus').textContent = '辨識功能載入失敗，請檢查網路後重試';
      return;
    }

    const reader = getReader();
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    reader.setHints(hints);

    try{
      liveScanControls = await reader.decodeFromConstraints(
        { video: { facingMode: { ideal: 'environment' } } },
        $('liveScanVideo'),
        (result, err, controls) => {
          if(result){
            const text = result.getText();
            const isQr = result.getBarcodeFormat() === ZXing.BarcodeFormat.QR_CODE;
            $('fCode').value = text;
            pendingFmt = isQr ? 'qr' : 'barcode';
            setFmt(pendingFmt);
            setScanStatus('已辨識：' + text, 'ok');
            toast('已自動填入卡號');
            controls.stop();
            liveScanControls = null;
            closeLiveScan();
          }
          // NotFoundException fires continuously between frames while still searching —
          // that's normal, not an error to surface.
        }
      );
      $('liveScanStatus').textContent = '掃描中…';
    }catch(e){
      if(e && (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError')){
        $('liveScanStatus').textContent = '未取得相機權限，請改用「上傳截圖」';
      }else if(e && e.name === 'NotFoundError'){
        $('liveScanStatus').textContent = '找不到可用的相機，請改用「上傳截圖」';
      }else{
        $('liveScanStatus').textContent = '相機啟動失敗，請改用「上傳截圖」';
      }
    }
  }

  $('scanLiveBtn').addEventListener('click', openLiveScan);
  $('liveScanClose').addEventListener('click', closeLiveScan);
  document.addEventListener('visibilitychange', () => {
    if(document.hidden && liveScanControls) closeLiveScan();
  });

  function setSlot(slot){
    pendingSlot = slot;
    [0,1,2,3].forEach(n => $('slot'+n).classList.toggle('active', n===slot));
    if(slot === 0){ $('slotHint').textContent = '指定後，長按主畫面 App 圖示即可直接跳到此卡的全螢幕條碼'; return; }
    const taken = cards.find(c => c.slot === slot && c.id !== editingId);
    $('slotHint').textContent = taken
      ? `快捷 ${slot} 目前是「${taken.name}」，儲存後將改為這張卡片`
      : `快捷 ${slot} 目前未指定，儲存後長按圖示即可快速顯示`;
  }
  [0,1,2,3].forEach(n => $('slot'+n).addEventListener('click', ()=> setSlot(n)));

  function openForm(id){
    editingId = id || null;
    $('nameErr').style.display='none';
    $('codeErr').style.display='none';
    setScanStatus('', '');
    if(id){
      const c = cards.find(x => x.id === id);
      $('formTitle').textContent = '編輯卡片';
      $('fName').value = c.name;
      $('fCode').value = c.code;
      $('fNote').value = c.note || '';
      pendingFmt = c.format;
      pendingColor = c.color;
      pendingSlot = c.slot || 0;
    } else {
      $('formTitle').textContent = '新增卡片';
      $('fName').value = '';
      $('fCode').value = '';
      $('fNote').value = '';
      pendingFmt = 'auto';
      pendingColor = COLORS[0].v;
      pendingSlot = 0;
    }
    setFmt(pendingFmt);
    setSlot(pendingSlot);
    buildSwatches();
    formOverlay.classList.add('show');
  }
  function closeForm(){ formOverlay.classList.remove('show'); stopLiveScan(); }
  $('addBtn').addEventListener('click', ()=> openForm(null));
  $('cancelBtn').addEventListener('click', closeForm);
  formOverlay.addEventListener('click', (e)=>{ if(e.target === formOverlay) closeForm(); });

  $('saveBtn').addEventListener('click', async ()=>{
    const name = $('fName').value.trim();
    const code = $('fCode').value.trim();
    let ok = true;
    if(!name){ $('nameErr').style.display='block'; ok=false; } else { $('nameErr').style.display='none'; }
    if(!code){ $('codeErr').style.display='block'; ok=false; } else { $('codeErr').style.display='none'; }
    if(!ok) return;
    const note = $('fNote').value.trim();

    // Only one card may hold a given quick-access slot at a time.
    if(pendingSlot !== 0){
      cards.forEach(c => { if(c.slot === pendingSlot && c.id !== editingId) c.slot = 0; });
    }

    if(editingId){
      const c = cards.find(x => x.id === editingId);
      c.name = name; c.code = code; c.note = note; c.format = pendingFmt; c.color = pendingColor; c.slot = pendingSlot;
      toast('已更新卡片');
    } else {
      const nc = { id: uid(), name, code, note, format: pendingFmt, color: pendingColor, slot: pendingSlot };
      cards.unshift(nc);
      activeId = nc.id;
      toast('已新增卡片');
    }
    await persist();
    closeForm();
    render();
  });

  const delOverlay = $('delOverlay');
  function openDelete(id){ deletingId = id; delOverlay.classList.add('show'); }
  function closeDelete(){ delOverlay.classList.remove('show'); }
  $('delCancel').addEventListener('click', closeDelete);
  delOverlay.addEventListener('click', (e)=>{ if(e.target === delOverlay) closeDelete(); });
  $('delConfirm').addEventListener('click', async ()=>{
    cards = cards.filter(c => c.id !== deletingId);
    if(activeId === deletingId) activeId = cards.length ? cards[0].id : null;
    await persist();
    closeDelete();
    render();
    toast('已刪除卡片');
  });

  $('searchInput').addEventListener('input', render);

  // ===== Quick view: opened directly from an installed App Shortcut =====
  // Android PWAs support static "shortcuts" in the manifest (long-press the
  // home screen icon). Each shortcut links to ?slot=N; whichever card the
  // user assigned to that slot is shown full-screen for fast scanning.
  function tryQuickView(){
    const params = new URLSearchParams(location.search);
    const slot = parseInt(params.get('slot'), 10);
    if(!slot) return false;

    let raw = [];
    try{ raw = JSON.parse(localStorage.getItem('cardwallet:cards') || '[]'); }catch(e){}
    const card = raw.find(c => c.slot === slot);

    const body = $('quickBody');
    if(card){
      const fmt = resolvedFormat(card);
      body.innerHTML = `
        <p class="qname">${escapeHtml(card.name)}</p>
        <p class="qmeta">快捷 ${slot} · ${formatLabel(fmt)}</p>
        <div class="quick-code" id="quickCode"></div>
      `;
      renderCode($('quickCode'), card.code, fmt);
    } else {
      body.innerHTML = `
        <p class="qname">尚未指定快捷 ${slot}</p>
        <p class="quick-empty">回到卡夾，編輯任一張卡片並在「主畫面快捷」選擇「快捷 ${slot}」即可。</p>
      `;
    }
    $('quickView').classList.add('show');
    return true;
  }
  $('quickClose').addEventListener('click', () => {
    $('quickView').classList.remove('show');
    // In some sandboxed preview contexts (e.g. a srcdoc iframe), history APIs are
    // blocked entirely — that's fine to skip, it only tidies the URL on real deployments.
    try{ history.replaceState(null, '', location.pathname); }catch(e){}
  });

  loadCards();
  tryQuickView();

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
