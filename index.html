   * qrcode
   * @param typeNumber 1 to 40

   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {

        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

      for (var i = 0; i < rsBlocks.length; i += 1) {

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }

      return data;

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {

        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {

          var buffer = qrBitBuffer();

            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

          for (var i = 0; i < rsBlocks.length; i++) {

      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';

        qrHtml += '</tr>';

      qrHtml += '</table>';

      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';

      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +

      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;

    var escapeXml = function(s) {

      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {

        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }

      return escaped;

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {

        '█ ': '▀',
        ' █': '▄',
        '  ': ' '

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];

        ascii += '\n';

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  qrcode.stringToBytesFuncs = {

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  header{ padding: 28px 22px 14px; position:relative; z-index:2; }

  .sub{ font-size:13px; color: rgba(238,229,211,0.55); margin: 6px 0 0; }

  .card{

    border-radius: 14px; background: var(--paper); color: var(--ink);

    cursor:pointer; overflow:hidden;
  }
  .card .tab{ position:absolute; top:0; left:0; width: 10px; height:100%; }
  .card-body{ padding: 16px 18px 16px 26px; }
  .card-behind{ height: 230px; transform-origin: top center; }
  .card-behind .card-body{ padding-top:14px; }

  .card-front{ z-index: 50; }
  .card-name{
    font-family: 'Roboto Slab', Georgia, serif;
    font-weight:700; font-size: 19px; margin: 0 0 3px; padding-right: 60px;
    word-break: break-word;
  }
  .card-cat{
    font-family: 'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
    color: var(--ink-soft); margin:0 0 14px;
  }
  .code-stage{
    background: var(--white); border-radius: 10px; padding: 14px 10px 10px;

  }
  .zoom-hint{

  .qr-box{ padding: 4px; line-height:0; }

  }
  .code-fallback{ font-size:12px; color: var(--accent-red); text-align:center; padding: 6px 4px; }

    border-top: 1px dashed rgba(42,33,25,0.18);

  }
  .icon-btn:active{ background: rgba(42,33,25,0.14); }
  .icon-btn.danger:active{ background: rgba(193,68,60,0.18); color:var(--accent-red); }
  .rail-label{
    padding: 6px 22px 8px; font-family: 'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:2px; color: rgba(238,229,211,0.4); text-transform:uppercase;
  }
  .rail{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
    gap:10px; padding: 4px 22px 18px;
  }

    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(238,229,211,0.15); border-left: 4px solid var(--accent-teal);
    border-radius: 8px; padding: 9px 13px; cursor:pointer; min-width:0;
  }
  .rail-item.active{ background: rgba(238,229,211,0.14); border-color: rgba(238,229,211,0.4); }
  .rail-item .n{
    font-family: 'Roboto Slab', Georgia, serif; font-size:13px; font-weight:700;
    color: var(--paper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .rail-item .c{
    font-family: 'IBM Plex Mono', monospace; font-size:10px;
    color: rgba(238,229,211,0.45); margin-top:3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .fab{
    position:fixed; bottom: 26px; left:50%; transform: translateX(calc(-50% + 190px));

    color: var(--felt-deep); border:none; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    font-size:28px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index: 40;
  }

  }
  .overlay.show{ opacity:1; pointer-events:auto; }

    width:100%; max-width:480px; background: var(--paper); color: var(--ink);

  }

  .sheet-title{ font-family: 'Roboto Slab', Georgia, serif; font-weight:700; font-size:20px; margin:0 0 18px; }
  .field{ margin-bottom:16px; }

    display:block; font-family: 'IBM Plex Mono', monospace; font-size:11px;

  }

    width:100%; border: 1px solid rgba(42,33,25,0.22); background: var(--white);

    font-family: inherit;
  }

    font-family: inherit;
  }

  }

    position:fixed; bottom:100px; left:50%; transform: translateX(-50%) translateY(10px);
    background: var(--paper); color: var(--ink); padding: 10px 18px; border-radius: 30px;
    font-size:13px; font-weight:500; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    opacity:0; pointer-events:none; transition: all .25s; z-index: 200;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  .slot-badge{
    position:absolute; top:14px; left:24px;
    background: var(--felt); color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 1px;
    padding: 3px 7px; border-radius: 5px;
    z-index: 6;
  }

  /* Fullscreen quick view — opened from an installed App Shortcut */
  .quick-view{
    display:none;
    position:fixed; inset:0; z-index: 300;
    background: var(--white);
    flex-direction:column; align-items:center; justify-content:center;
    padding: env(safe-area-inset-top) 24px calc(24px + env(safe-area-inset-bottom));
  }
  .quick-view.show{ display:flex; }
  .quick-close{
    position:absolute; top: calc(18px + env(safe-area-inset-top)); right:18px;
    width:38px; height:38px; border-radius:50%; border:none;
    background: rgba(42,33,25,0.08); color: var(--ink-soft);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .quick-body{ width:100%; max-width:360px; text-align:center; }
  .quick-body .qname{
    font-family: 'Roboto Slab', Georgia, serif; font-weight:700;
    font-size: 22px; color: var(--ink); margin: 0 0 4px;
  }
  .quick-body .qmeta{
    font-family: 'IBM Plex Mono', monospace; font-size:11px;
    letter-spacing:1.5px; text-transform:uppercase; color: var(--ink-soft); margin: 0 0 22px;
  }
  .quick-code{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .quick-code svg{ width:100%; max-width:320px; height:auto; }
  .quick-code .code-text{ font-size:15px; letter-spacing:2px; }
  .quick-empty{ color: var(--ink-soft); font-size:14px; line-height:1.7; }
</style>
</head>
<body>
<div id="app">
  <header>
    <p class="eyebrow">CARD FILE · 資料卡夾</p>
    <h1>我的卡片</h1>
    <p class="sub" id="countSub">尚未新增任何卡片</p>
  </header>

  <div class="search-row">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" placeholder="搜尋卡片名稱或卡號…">
    </div>
  </div>

  <div class="stage-wrap"><div class="stage" id="stage"></div></div>

  <div id="railSection">
    <p class="rail-label">全部卡片</p>
    <div class="rail" id="rail"></div>
  </div>

  <button class="fab" id="addBtn" aria-label="新增卡片">＋</button>
</div>

<div class="overlay" id="formOverlay">
  <div class="sheet">
    <h2 class="sheet-title" id="formTitle">新增卡片</h2>
    <div class="field">
      <label>卡片名稱</label>
      <input id="fName" placeholder="例如：全聯會員卡、統一發票載具">
    </div>
    <p class="err" id="nameErr">請輸入卡片名稱</p>

    <div class="field">
      <label>卡號 / 條碼內容</label>
      <input id="fCode" placeholder="輸入數字或條碼字串">
      <p class="hint" id="autoHint">格式將自動偵測</p>
    </div>
    <p class="err" id="codeErr">請輸入卡號內容</p>

    <div class="field">
      <label>顯示格式</label>
      <div class="seg">
        <button type="button" data-fmt="auto" id="fmtAuto">自動偵測</button>
        <button type="button" data-fmt="barcode" id="fmtBarcode">條碼</button>
        <button type="button" data-fmt="qr" id="fmtQr">QR Code</button>
      </div>
    </div>

    <div class="field">
      <label>標籤色</label>
      <div class="swatches" id="swatches"></div>
    </div>

    <div class="field">
      <label>主畫面快捷（長按 App 圖示）</label>
      <div class="seg">
        <button type="button" data-slot="0" id="slot0">不指定</button>
        <button type="button" data-slot="1" id="slot1">快捷 1</button>
        <button type="button" data-slot="2" id="slot2">快捷 2</button>
        <button type="button" data-slot="3" id="slot3">快捷 3</button>
      </div>
      <p class="hint" id="slotHint">指定後，長按主畫面 App 圖示即可直接跳到此卡的全螢幕條碼</p>
    </div>

    <div class="field">
      <label>備註（選填）</label>
      <textarea id="fNote" rows="2" placeholder="例如：結帳時先出示載具再付款"></textarea>
    </div>

    <div class="sheet-btns">
      <button class="btn ghost" id="cancelBtn">取消</button>
      <button class="btn primary" id="saveBtn">儲存</button>
    </div>
  </div>
</div>

<div class="overlay" id="delOverlay">
  <div class="sheet">
    <h2 class="sheet-title">刪除這張卡片？</h2>
    <p style="font-size:13px;color:var(--ink-soft);margin:-8px 0 18px;">此動作無法復原。</p>
    <div class="sheet-btns">
      <button class="btn ghost" id="delCancel">取消</button>
      <button class="btn delete-confirm" id="delConfirm">刪除</button>
    </div>
  </div>
</div>

<!-- Fullscreen quick-view (opened via App shortcut / ?slot=N) -->
<div id="quickView" class="quick-view">
  <button class="quick-close" id="quickClose" aria-label="關閉">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <div class="quick-body" id="quickBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const COLORS = [
    {v:'#c1443c', name:'紅'},
    {v:'#d1963a', name:'金'},
    {v:'#3e7c72', name:'綠'},
    {v:'#3e6b8a', name:'藍'},
    {v:'#7a4c6d', name:'紫'},
    {v:'#6d7a4c', name:'橄欖'}
  ];

  let cards = [];
  let activeId = null;
  let cardEls = new Map(); // card id -> persisted DOM node, so CSS transitions animate on reorder
  let editingId = null;
  let deletingId = null;
  let pendingFmt = 'auto';
  let pendingColor = COLORS[0].v;
  let pendingSlot = 0;

  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  const rail = $('rail');
  const countSub = $('countSub');

  function uid(){ return 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function toast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=> t.classList.remove('show'), 1600);
  }

  // CODE128 (JsBarcode) can encode any ASCII 0-127 character. If the code
  // contains non-ASCII characters (e.g. Chinese) or is long, QR reads more
  // reliably, so auto-detect steers toward QR in those cases.
  function isAsciiOnly(str){ return /^[\x20-\x7E]+$/.test(str); }
  function autoFormat(code){
    if(!code) return 'barcode';
    if(!isAsciiOnly(code)) return 'qr';
    if(code.length > 24) return 'qr';
    return 'barcode';
  }
  function resolvedFormat(card){
    return card.format === 'auto' ? autoFormat(card.code) : card.format;
  }

  async function loadCards(){
    try{
      const raw = localStorage.getItem('cardwallet:cards');
      cards = raw ? JSON.parse(raw) : [];
    }catch(e){ cards = []; }
    if(cards.length && !activeId) activeId = cards[0].id;
    render();
  }

  async function persist(){
    try{ localStorage.setItem('cardwallet:cards', JSON.stringify(cards)); }
    catch(e){ toast('儲存失敗，請重試'); }
  }

  function filteredCards(){
    const q = $('searchInput').value.trim().toLowerCase();
    if(!q) return cards;
    return cards.filter(c => c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q));
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function renderRail(){
    const list = filteredCards();
    rail.innerHTML = '';
    list.forEach(c => {
      const el = document.createElement('div');
      el.className = 'rail-item' + (c.id === activeId ? ' active' : '');
      el.style.borderLeftColor = c.color;
      el.innerHTML = `<div class="n">${escapeHtml(c.name)}</div><div class="c">${escapeHtml(c.code)}</div>`;
      el.addEventListener('click', () => { activeId = c.id; render(); });
      rail.appendChild(el);
    });
  }

  function formatLabel(fmt){
    return fmt === 'qr' ? 'QR CODE' : 'BARCODE';
  }

  function renderStage(){
    const list = filteredCards();
    if(list.length === 0){
      cardEls.forEach(el => el.remove());
      cardEls.clear();
      stage.style.height = 'auto';
      stage.innerHTML = `<div class="empty-state">
          <p class="stamp">— 抽屜是空的 —</p>
          <p>點右下角「＋」新增第一張卡片</p>
        </div>`;
      return;
    }
    const emptyEl = stage.querySelector('.empty-state');
    if(emptyEl) emptyEl.remove();
    stage.style.height = '300px';

    let active = list.find(c => c.id === activeId) || list[0];
    activeId = active.id;
    const others = list.filter(c => c.id !== active.id).slice(0, 3);
    const visibleIds = new Set([active.id, ...others.map(c => c.id)]);

    // drop nodes for cards no longer shown (deleted, filtered out, or pushed past depth 3)
    cardEls.forEach((el, id) => {
      if(!visibleIds.has(id)){ el.remove(); cardEls.delete(id); }
    });

    // fanned stack, back-to-front so later (closer) cards sit on top visually.
    // Spread is deliberately generous so the "slide to front" motion reads clearly.
    const fanAngles = [10, -11, 9];
    for(let i = others.length - 1; i >= 0; i--){
      const c = others[i];
      const depth = i + 1;
      let el = cardEls.get(c.id);
      let isNewEl = false;
      if(!el){
        el = document.createElement('div');
        stage.appendChild(el);
        cardEls.set(c.id, el);
        isNewEl = true;
      }
      el.className = 'card card-behind';
      el.style.zIndex = 10 + (others.length - i);
      const angle = fanAngles[i % fanAngles.length];
      el.style.transform = `translateX(-50%) translateY(${depth*20}px) scale(${1 - depth*0.075}) rotate(${angle}deg)`;
      el.style.opacity = 0.85 - depth*0.2;
      el.innerHTML = `<div class="tab" style="background:${c.color}"></div>
        <div class="card-body">
          <p class="card-name" style="font-size:16px;">${escapeHtml(c.name)}</p>
          <p class="peek-label">輕點以切換到最上面</p>
        </div>`;
      el.onclick = () => { activeId = c.id; render(); };
      fadeInBody(el, isNewEl);
    }

    const fmt = resolvedFormat(active);
    let front = cardEls.get(active.id);
    let isNewFront = false;
    if(!front){
      front = document.createElement('div');
      cardEls.set(active.id, front);
      isNewFront = true;
    }
    front.className = 'card card-front';
    front.style.zIndex = 50;
    front.style.opacity = 1;
    front.style.transform = 'translateX(-50%) translateY(0) scale(1) rotate(0deg)';
    front.onclick = null;
    front.innerHTML = `
      <div class="tab" style="background:${active.color}"></div>
      ${active.slot ? `<div class="slot-badge">快捷 ${active.slot}</div>` : ''}
      <div class="card-actions">
        <button class="icon-btn" data-act="edit" title="編輯">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="icon-btn danger" data-act="del" title="刪除">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
      </div>
      <div class="card-body">
        <p class="card-name">${escapeHtml(active.name)}</p>
        <p class="card-cat">${formatLabel(fmt)}${active.format === 'auto' ? ' · 自動' : ''} · ${COLORS.find(x=>x.v===active.color) ? COLORS.find(x=>x.v===active.color).name + '色標' : ''}</p>
        <div class="code-stage" id="codeStage"></div>
        ${active.note ? `<p class="card-note">${escapeHtml(active.note)}</p>` : ''}
      </div>
    `;
    // re-append last so it's on top of DOM order too (stacking-context safety)
    stage.appendChild(front);

    const codeStage = front.querySelector('#codeStage');
    renderCode(codeStage, active.code, fmt);
    const hint = document.createElement('div');
    hint.className = 'zoom-hint';
    hint.innerHTML = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> 放大`;
    codeStage.appendChild(hint);
    codeStage.addEventListener('click', (e) => { e.stopPropagation(); openZoom(active); });

    front.querySelector('[data-act="edit"]').addEventListener('click', (e)=>{ e.stopPropagation(); openForm(active.id); });
    front.querySelector('[data-act="del"]').addEventListener('click', (e)=>{ e.stopPropagation(); openDelete(active.id); });
    fadeInBody(front, isNewFront);
  }

  // Content inside a reused card node swaps instantly (different card's text/buttons),
  // which reads as a "jump" even while the outer position animates smoothly. Fading the
  // body in softens that swap so the whole transition feels continuous.
  function fadeInBody(el, skipFade){
    const body = el.querySelector('.card-body');
    if(!body) return;
    if(skipFade){ body.style.transition = 'none'; body.style.opacity = '1'; return; }
    body.style.transition = 'none';
    body.style.opacity = '0';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        body.style.transition = 'opacity .38s ease .06s';
        body.style.opacity = '1';
      });
    });
  }

  // Tap-to-zoom: reuse the same fullscreen white view used by App Shortcuts,
  // since a large, high-contrast barcode is exactly what's needed at checkout.
  function openZoom(card){
    const fmt = resolvedFormat(card);
    const body = $('quickBody');
    body.innerHTML = `
      <p class="qname">${escapeHtml(card.name)}</p>
      <p class="qmeta">${formatLabel(fmt)}${card.format === 'auto' ? ' · 自動' : ''}</p>
      <div class="quick-code" id="quickCode"></div>
    `;
    renderCode($('quickCode'), card.code, fmt);
    $('quickView').classList.add('show');
  }

  function renderCode(container, code, fmt){
    container.innerHTML = '';
    let drew = false;

    if(fmt === 'qr'){
      try{
        const box = document.createElement('div');
        box.className = 'qr-box';
        container.appendChild(box);
        const qr = qrcode(0, 'M');
        qr.addData(code);
        qr.make();
        box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2 });
        drew = true;
      }catch(e){ drew = false; }
    } else {
      try{
        const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
        container.appendChild(svg);
        JsBarcode(svg, code, { format:'CODE128', lineColor:'#2a2119', width:2, height:64, displayValue:false, margin:0 });
        drew = true;
      }catch(e){ drew = false; }
    }

    if(!drew){
      // fallback: try the other format automatically before giving up
      const altFmt = fmt === 'qr' ? 'barcode' : 'qr';
      try{
        if(altFmt === 'qr'){
          const box = document.createElement('div');
          box.className = 'qr-box';
          container.appendChild(box);
          const qr = qrcode(0, 'M');
          qr.addData(code);
          qr.make();
          box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2 });
          drew = true;
        } else {
          const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
          container.appendChild(svg);
          JsBarcode(svg, code, { format:'CODE128', lineColor:'#2a2119', width:2, height:64, displayValue:false, margin:0 });
          drew = true;
        }
      }catch(e){ drew = false; }
    }

    if(!drew){
      const p = document.createElement('p');
      p.className = 'code-fallback';
      p.textContent = '此卡號無法產生條碼／QR，請確認內容';
      container.appendChild(p);
    }

    const codeText = document.createElement('p');
    codeText.className = 'code-text';
    codeText.textContent = code;
    container.appendChild(codeText);
  }

  function render(){
    const list = filteredCards();
    countSub.textContent = cards.length === 0
      ? '尚未新增任何卡片'
      : (list.length === cards.length ? `共 ${cards.length} 張卡片` : `符合搜尋：${list.length} / ${cards.length} 張`);
    renderStage();
    renderRail();
  }

  const formOverlay = $('formOverlay');
  function buildSwatches(){
    const wrap = $('swatches');
    wrap.innerHTML = '';
    COLORS.forEach(c => {
      const s = document.createElement('div');
      s.className = 'swatch' + (c.v === pendingColor ? ' active' : '');
      s.style.background = c.v;
      s.addEventListener('click', () => { pendingColor = c.v; buildSwatches(); });
      wrap.appendChild(s);
    });
  }
  function setFmt(fmt){
    pendingFmt = fmt;
    $('fmtAuto').classList.toggle('active', fmt==='auto');
    $('fmtBarcode').classList.toggle('active', fmt==='barcode');
    $('fmtQr').classList.toggle('active', fmt==='qr');
    updateAutoHint();
  }
  function updateAutoHint(){
    const code = $('fCode').value.trim();
    if(pendingFmt !== 'auto'){ $('autoHint').textContent = ''; return; }
    if(!code){ $('autoHint').textContent = '格式將自動偵測'; return; }
    const guess = autoFormat(code);
    $('autoHint').textContent = '自動偵測結果：' + (guess === 'qr' ? 'QR Code（內容含中文或較長）' : '條碼 Barcode');
  }
  $('fmtAuto').addEventListener('click', ()=> setFmt('auto'));
  $('fmtBarcode').addEventListener('click', ()=> setFmt('barcode'));
  $('fmtQr').addEventListener('click', ()=> setFmt('qr'));
  $('fCode').addEventListener('input', updateAutoHint);

  function setSlot(slot){
    pendingSlot = slot;
    [0,1,2,3].forEach(n => $('slot'+n).classList.toggle('active', n===slot));
    if(slot === 0){ $('slotHint').textContent = '指定後，長按主畫面 App 圖示即可直接跳到此卡的全螢幕條碼'; return; }
    const taken = cards.find(c => c.slot === slot && c.id !== editingId);
    $('slotHint').textContent = taken
      ? `快捷 ${slot} 目前是「${taken.name}」，儲存後將改為這張卡片`
      : `快捷 ${slot} 目前未指定，儲存後長按圖示即可快速顯示`;
  }
  [0,1,2,3].forEach(n => $('slot'+n).addEventListener('click', ()=> setSlot(n)));

  function openForm(id){
    editingId = id || null;
    $('nameErr').style.display='none';
    $('codeErr').style.display='none';
    if(id){
      const c = cards.find(x => x.id === id);
      $('formTitle').textContent = '編輯卡片';
      $('fName').value = c.name;
      $('fCode').value = c.code;
      $('fNote').value = c.note || '';
      pendingFmt = c.format;
      pendingColor = c.color;
      pendingSlot = c.slot || 0;
    } else {
      $('formTitle').textContent = '新增卡片';
      $('fName').value = '';
      $('fCode').value = '';
      $('fNote').value = '';
      pendingFmt = 'auto';
      pendingColor = COLORS[0].v;
      pendingSlot = 0;
    }
    setFmt(pendingFmt);
    setSlot(pendingSlot);
    buildSwatches();
    formOverlay.classList.add('show');
  }
  function closeForm(){ formOverlay.classList.remove('show'); }
  $('addBtn').addEventListener('click', ()=> openForm(null));
  $('cancelBtn').addEventListener('click', closeForm);
  formOverlay.addEventListener('click', (e)=>{ if(e.target === formOverlay) closeForm(); });

  $('saveBtn').addEventListener('click', async ()=>{
    const name = $('fName').value.trim();
    const code = $('fCode').value.trim();
    let ok = true;
    if(!name){ $('nameErr').style.display='block'; ok=false; } else { $('nameErr').style.display='none'; }
    if(!code){ $('codeErr').style.display='block'; ok=false; } else { $('codeErr').style.display='none'; }
    if(!ok) return;
    const note = $('fNote').value.trim();

    // Only one card may hold a given quick-access slot at a time.
    if(pendingSlot !== 0){
      cards.forEach(c => { if(c.slot === pendingSlot && c.id !== editingId) c.slot = 0; });
    }

    if(editingId){
      const c = cards.find(x => x.id === editingId);
      c.name = name; c.code = code; c.note = note; c.format = pendingFmt; c.color = pendingColor; c.slot = pendingSlot;
      toast('已更新卡片');
    } else {
      const nc = { id: uid(), name, code, note, format: pendingFmt, color: pendingColor, slot: pendingSlot };
      cards.unshift(nc);
      activeId = nc.id;
      toast('已新增卡片');
    }
    await persist();
    closeForm();
    render();
  });

  const delOverlay = $('delOverlay');
  function openDelete(id){ deletingId = id; delOverlay.classList.add('show'); }
  function closeDelete(){ delOverlay.classList.remove('show'); }
  $('delCancel').addEventListener('click', closeDelete);
  delOverlay.addEventListener('click', (e)=>{ if(e.target === delOverlay) closeDelete(); });
  $('delConfirm').addEventListener('click', async ()=>{
    cards = cards.filter(c => c.id !== deletingId);
    if(activeId === deletingId) activeId = cards.length ? cards[0].id : null;
    await persist();
    closeDelete();
    render();
    toast('已刪除卡片');
  });

  $('searchInput').addEventListener('input', render);

  // ===== Quick view: opened directly from an installed App Shortcut =====
  // Android PWAs support static "shortcuts" in the manifest (long-press the
  // home screen icon). Each shortcut links to ?slot=N; whichever card the
  // user assigned to that slot is shown full-screen for fast scanning.
  function tryQuickView(){
    const params = new URLSearchParams(location.search);
    const slot = parseInt(params.get('slot'), 10);
    if(!slot) return false;

    let raw = [];
    try{ raw = JSON.parse(localStorage.getItem('cardwallet:cards') || '[]'); }catch(e){}
    const card = raw.find(c => c.slot === slot);

    const body = $('quickBody');
    if(card){
      const fmt = resolvedFormat(card);
      body.innerHTML = `
        <p class="qname">${escapeHtml(card.name)}</p>
        <p class="qmeta">快捷 ${slot} · ${formatLabel(fmt)}</p>
        <div class="quick-code" id="quickCode"></div>
      `;
      renderCode($('quickCode'), card.code, fmt);
    } else {
      body.innerHTML = `
        <p class="qname">尚未指定快捷 ${slot}</p>
        <p class="quick-empty">回到卡夾，編輯任一張卡片並在「主畫面快捷」選擇「快捷 ${slot}」即可。</p>
      `;
    }
    $('quickView').classList.add('show');
    return true;
  }
  $('quickClose').addEventListener('click', () => {
    $('quickView').classList.remove('show');
    // In some sandboxed preview contexts (e.g. a srcdoc iframe), history APIs are
    // blocked entirely — that's fine to skip, it only tidies the URL on real deployments.
    try{ history.replaceState(null, '', location.pathname); }catch(e){}
  });

  loadCards();
  tryQuickView();

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
